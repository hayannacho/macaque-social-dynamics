[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macaque-social-dynamics"
version = "0.1.0"
description = "Team-developed macaque social dynamics simulator; Anna Cho's configuration and biological initialization portfolio"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.26,<3", "plotly>=5,<8", "PyYAML>=6,<7", "networkx>=3,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
studies = ["matplotlib>=3.8,<4"]
images = ["kaleido>=1,<2"]

[tool.setuptools.packages.find]
include = ["macaque_sim*"]

[tool.pytest.ini_options]
testpaths = ["macaque_sim/tests"]
