name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: constraints-tested.txt
      - run: python -m pip install -c constraints-tested.txt -e ".[dev]"
      - run: python -m pytest
      - run: python examples/contribution_demo.py
      - run: python -m macaque_sim.main --config examples/quickstart.json
